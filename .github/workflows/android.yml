name: Android

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
      - '.gitignore'

permissions:
  contents: read

jobs:
  build:
    runs-on: [self-hosted, Linux, X64, ci-runner, calino]

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ""

      - name: Keep a stable debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: calino-russian-debug-keystore-v1

      - name: Install Android SDK packages
        run: |
          android --sdk "$ANDROID_HOME" sdk install --no-metrics platforms/android-37.0
          android --sdk "$ANDROID_HOME" sdk install --no-metrics platforms/android-36
          android --sdk "$ANDROID_HOME" sdk install --no-metrics build-tools/36.0.0
          android --sdk "$ANDROID_HOME" sdk install --no-metrics platform-tools

      - name: Check Russian resources
        run: python3 scripts/check-russian-resources.py

      - name: Run checks
        run: ./gradlew test lintDebug assembleDebug

      - name: Upload Russian debug APKs
        uses: actions/upload-artifact@v4
        with:
          name: calino-ru-debug
          if-no-files-found: error
          retention-days: 14
          path: |
            app/build/outputs/apk/debug/*.apk
            wear/build/outputs/apk/debug/*.apk
